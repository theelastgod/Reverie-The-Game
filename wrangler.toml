name = "reverie-the-game"
main = "server/src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true

[assets]
directory = "./site"
binding = "ASSETS"

[durable_objects]
bindings = [{ name = "WORLD", class_name = "ReverieWorld" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReverieWorld"]

# The writeback log: the account's `reverie-log` database (created 2026-09-26,
# the first migration applied). `npm run d1:migrate:remote` applies any later
# migration before a deploy; local development uses a sqlite file under the
# same name.
[[d1_databases]]
binding = "LOG"
database_name = "reverie-log"
database_id = "7243c40d-ba27-40cc-bc48-f9a786980442"
migrations_dir = "server/migrations"

# The test link (serial + mock signature) is a development convenience.
# `.dev.vars` turns it on for `wrangler dev`; a deployed city keeps it off and
# links Angels through /wallet. The serial comes from the holders map (test
# serials, and the only source until the contract exists); once ANGEL_CONTRACT
# and ANGEL_RPC_URL are set the Worker reads ownership from the chain with two
# eth_calls (balanceOf, tokenOfOwnerByIndex), cached five minutes per address,
# and the map is an override. Never a transaction.
[vars]
MOCK_LINK = "0"
ANGEL_HOLDERS = "{}"
ANGEL_CONTRACT = ""
ANGEL_RPC_URL = ""
ANGEL_TOKEN_OFFSET = "0"
