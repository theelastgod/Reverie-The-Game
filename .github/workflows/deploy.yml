# Deploys the checked-out branch to the Worker named in wrangler.toml, or, with
# "check" typed in, proves the pipeline on GitHub's runners without touching
# Cloudflare: the install, the gates, the client build and stage, and a dry-run
# bundle of the Worker, no secrets needed. Nothing here runs on a push: the
# same check runs by itself on every push from gates.yml, which GitHub takes
# from the pushed branch; "check" is a hand-run of those steps. GitHub
# registers dispatched workflows from the default branch only: while this file
# lives on a feature branch alone, neither the Actions tab nor the API (404)
# can start it. Once it is on main, the tab's "Run workflow" button runs it,
# and the CLI can run the branch's copy:
#   gh workflow run deploy.yml --ref <branch> -f confirm=check   (or confirm=deploy)
# A deploy needs two repository secrets, set once under Settings → Secrets and
# variables → Actions: CLOUDFLARE_API_TOKEN (a token with Workers Scripts,
# Workers KV/Durable Objects and D1 edit rights) and CLOUDFLARE_ACCOUNT_ID. The
# token never goes into the repository, and here it reaches only the two steps
# that talk to Cloudflare, never the install or the tests. The client is built
# and staged before the database is touched, so a build that fails leaves the
# live Worker and its schema as they were.
name: Deploy the city

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to deploy this branch to the Worker in wrangler.toml, or "check" to run the gates and a dry-run bundle without deploying'
        required: true
        default: ""

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy' || inputs.confirm == 'check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refuse a deploy without the secrets
        if: ${{ inputs.confirm == 'deploy' }}
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets." >&2
            exit 1
          fi
      - run: npm ci
      - name: The gates
        run: |
          npm run typecheck
          npm test
      - name: Build the client and stage it
        # The gates typechecked already; this is `npm run build:play` without its second typecheck.
        run: |
          VITE_BASE=/play/ npx vite build
          node scripts/stage-play.mjs
      - name: Bundle the Worker without deploying
        # The check's last step: the same bundle a deploy would upload, written to the runner and never sent.
        if: ${{ inputs.confirm == 'check' }}
        run: npx wrangler deploy --dry-run --outdir .wrangler/check
      - name: Apply any pending D1 migration to reverie-log
        if: ${{ inputs.confirm == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run d1:migrate:remote
      - name: Deploy the Worker
        # An explicit bash shell runs with pipefail, so a failed deploy fails the step even though tee succeeds.
        if: ${{ inputs.confirm == 'deploy' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy 2>&1 | tee deploy.log
      - name: The city answers, and names this commit
        # /health carries the release stage-play.mjs wrote (the commit it was built from). The new version takes a
        # moment to reach every edge, so this polls for up to a minute; a city that still names another commit after
        # that is a deploy that did not take, whatever wrangler printed.
        if: ${{ inputs.confirm == 'deploy' }}
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "wrangler printed no workers.dev URL; read deploy.log above" >&2; exit 1; fi
          echo "deployed at $url"
          for i in $(seq 1 12); do
            live=$(curl -fsS "$url/health" | jq -r '.release.revision // empty' 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "the city names $GITHUB_SHA"; exit 0; fi
            echo "try $i: the city names '${live:-nothing}'"
            sleep 5
          done
          echo "the city does not name this commit ($GITHUB_SHA) after a minute; the deploy did not take" >&2
          exit 1
