<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Master prompt — Reverie: The Game</title>
    <link rel="icon" href="./assets/wing-star.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="bar">
        <a class="brand" href="./">
          <img src="./assets/wing-star.png" alt="" width="36" height="36" />
          <span>REVERIE: THE GAME</span>
        </a>
        <nav>
          <a href="./">Home</a>
          <a href="./PROMPT.md">Raw markdown</a>
        </nav>
      </header>
      <div class="prompt-wrap">
        <p class="tag">Build brief · execute this</p>
        <h1 style="font-size: clamp(2rem, 5vw, 3.2rem); margin-bottom: 1.5rem;">MASTER PROMPT</h1>
        <pre id="md">Loading…</pre>
      </div>
    </div>
    <script>
      fetch("./PROMPT.md")
        .then((r) => r.text())
        .then((t) => { document.getElementById("md").textContent = t; })
        .catch(() => { document.getElementById("md").textContent = "Could not load PROMPT.md"; });
    </script>
  </body>
</html>
